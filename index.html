    />
    <meta name="author" content="Orvix.id" />

    <!-- Everything below is the static fallback for scrapers that never run JS.
         SEOHead.tsx re-renders the same set per route for crawlers that do.

         data-rh="true" is load-bearing. It is the attribute react-helmet-async
         stamps on tags it owns, so marking these makes Helmet REPLACE them on
         mount. Without it Helmet only appends, and every route ends up serving
         two og:image and two canonical values — scrapers then pick whichever
         they see first, which is always the home-page default.

         Do not add data-rh to charset/viewport/icons/theme-color/author or the
         JSON-LD block: Helmet does not render those, and any data-rh tag it
         cannot match gets deleted. -->
    <meta
      data-rh="true"
      name="keywords"
      content="orvix cloud platform, cloud platform indonesia, managed database indonesia, managed mysql, AI gateway, PaaS indonesia, deploy aplikasi, object storage indonesia, managed cloud, cloud migration, private cloud, hybrid cloud, devops indonesia, backup disaster recovery, monitoring dan security"
    />

    <link data-rh="true" rel="canonical" href="https://orvix.id/" />
